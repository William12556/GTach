[build-system]
requires = ["setuptools>=61.0", "build>=0.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtach"
version = "0.4.5"
authors = [
    {name = "GTach Project Contributors"},
]
description = "Retro-styled OBD-II tachometer for the Raspberry Pi with an ELM327 adapter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Embedded Systems",
]
keywords = ["obd2", "elm327", "tachometer", "raspberry-pi"]
dependencies = [
    "PyYAML>=6.0",
    "pyserial>=3.5",
    "pygame>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=5.0",
    "mypy>=1.0",
]
pi = [
    "RPi.GPIO>=0.7.1",
    "hyperpixel2r>=0.0.1",
]
[project.urls]
Homepage = "https://github.com/William12556/GTach"
Documentation = "https://github.com/William12556/GTach/blob/main/README.md"
Repository = "https://github.com/William12556/GTach"
"Bug Tracker" = "https://github.com/William12556/GTach/issues"

[project.scripts]
gtach = "gtach.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# assets/*.yaml carries engine_profiles.yaml, which
# load_engine_profile reads at startup. Its absence made two
# of three engine profiles unreachable and the
# engine_profile setting inert, and produced a WARNING on
# every start (issue-c1d4b8e6). The fonts glob dates from
# issue-d7f2b4e6, the same class of defect.
"gtach" = [
    "assets/fonts/*.ttf",
    "assets/fonts/*.otf",
    "assets/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
cache_dir = ".cache/pytest"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
]

[tool.coverage.run]
data_file = ".cache/.coverage"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["gtach"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "RPi.*",
    "hyperpixel2r.*",
    "bluetooth.*",
]
ignore_missing_imports = true
